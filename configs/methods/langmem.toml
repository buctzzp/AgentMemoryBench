# LangMem 0.0.30 async background MemoryStoreManager 产品配置。
#
# API runtime/model、worker timeout 与 conversation workers 由独立组合根注入；
# 本文件只保留 session memory 算法与 controlled MiniLM 参数。
# 当前官方 repo 对五个 Phase-1 benchmark 均无 author harness，故不虚构 author section。

[method]
embedding_model_path = "models/all-MiniLM-L6-v2"
embedding_dimension = 384
embedding_normalize = true
query_limit = 5
max_steps = 1
enable_inserts = true
enable_deletes = false
