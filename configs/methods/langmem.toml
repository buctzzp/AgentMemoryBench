# LangMem 0.0.30 async background MemoryStoreManager 产品配置。
#
# 两个 section 只切换 API runtime/model 与 full worker 上限；session 粒度、public
# factory 默认、InMemoryStore、controlled MiniLM 与 query/readout 语义完全相同。
# 当前官方 repo 对五个 Phase-1 benchmark 均无 author harness，故不虚构 author section。

[smoke]
answer_builder = "benchmark"
llm_model = "ox-alpha-free"
embedding_model_path = "models/all-MiniLM-L6-v2"
embedding_dimension = 384
embedding_normalize = true
query_limit = 5
max_steps = 1
enable_inserts = true
enable_deletes = false
worker_request_timeout_seconds = 600.0
max_workers = 1

[official_full]
answer_builder = "benchmark"
llm_model = "gpt-4o-mini"
embedding_model_path = "models/all-MiniLM-L6-v2"
embedding_dimension = 384
embedding_normalize = true
query_limit = 5
max_steps = 1
enable_inserts = true
enable_deletes = false
worker_request_timeout_seconds = 600.0
max_workers = 10
