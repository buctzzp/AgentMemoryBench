# EverOS v1.2.3 product-chat 的 method-owned 参数。
#
# API runtime、请求重试、conversation workers 与 lifecycle timeout 由独立
# configs/runtime/api.toml + configs/execution/prediction.toml 组合注入。主比较经 upstream
# EmbeddingProvider seam 使用本地 MiniLM-384；LanceDB L2 在模型内 L2-normalize 后与 cosine
# 排序单调等价。旧 Qwen3-Embedding-4B/1024 状态不可复用，必须以新 run_id 全量重建。

[method]
memory_mode = "chat"
search_method = "hybrid"
add_batch_size = 25
embedding_model = "models/all-MiniLM-L6-v2"
embedding_dimension = 384
embedding_provider = "sentence-transformers-local"
rerank_capability_mode = "disabled-zero-call"
app_id = "memorybenchmark"
project_id = "phase1"
