# Graphiti OSS v0.29.3 direct-core + FalkorDB Lite 产品配置。
#
# API runtime/model 与 structured-output transport 由独立 runtime profile 注入；
# turn 粒度、默认 edge BM25+cosine+RRF search、本地 MiniLM、独占物理 DB、lineage
# 与 readout 完全一致。current upstream 只有 LongMemEval graph-build payload anchor，
# 没有可复现的完整 QA author profile，故不虚构 author_* section。

[method]
llm_temperature = 1.0
llm_max_tokens = 16384
embedding_model_path = "models/all-MiniLM-L6-v2"
embedding_dimension = 384
embedding_normalize = true
# 上限 20：通用 QA/检索实际请求 10；HaluMem QA 官方框架契约请求 20。
query_limit = 20
max_coroutines = 10
