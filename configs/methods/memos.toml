# MemOS v2.0.25 product profile（source lock: v2.0.25@e820406）。
#
# 主运行身份（M1 最终裁决 + R2 验收锁定，不得在本文件放宽）：
#   tree_text + MultiModalStructMemReader + typed Add/SearchHandler
#   add: async_mode="async" / mode=None → 本地队列 → product 默认 parallel
#        dispatcher → MEM_READ fine 抽取 → raw 清理 → refresh
#   HTTP host / server_router 一律禁止；答题走 framework benchmark builder。
#
# API runtime、task timeout 与 conversation workers 由独立组合根注入；MemOS 的
# method capability cap 固定为 1。虽然 runner 可为 W2 构造两个 provider，但
# MemOSRuntimeOwner 仍会
# 按同一 config 复用进程级 runtime/embedder；真实 LongMemEval W2 已在并发
# SentenceTransformer tokenizer 上触发 `RuntimeError: Already borrowed`。因此当前
# product profile 明确不支持 framework conversation 并行，CLI 必须在 runtime/API
# 启动前拒绝 `--workers` 覆盖。MemOS 产品内部 async dispatcher 保持开启。
# secret 只声明**环境变量名**，值不进本文件、不进 manifest、不进日志。

[method]
embedding_backend = "sentence_transformer"
embedding_model_path = "models/all-MiniLM-L6-v2"
embedding_dimension = 384
embedding_max_tokens = 8192
embedding_trust_remote = false
memory_backend = "tree_text"
reader_backend = "multimodal_struct"
add_async_mode = "async"
use_redis_queue = false
parallel_dispatch = true
reorganize = false
reranker_backend = "cosine_local"
search_mode = "fast"
search_relativity = 0.45
search_dedup = "mmr"
search_rerank = true
include_preference = false
search_tool_memory = false
include_skill_memory = false
neighbor_discovery = false
internet_search = false
graph_db_backend = "neo4j-community"
graph_db_uri = "bolt://localhost:7687"
graph_db_user = "neo4j"
graph_db_name = "neo4j"
graph_db_credential_env = "MEMOS_NEO4J_PASSWORD"
vector_db_host = "localhost"
vector_db_port = 6333
vector_db_credential_env = "MEMOS_QDRANT_API_KEY"
