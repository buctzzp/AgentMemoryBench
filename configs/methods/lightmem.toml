# LightMem 官方 conversation-QA method 参数。API runtime/network、answer builder、stdout
# 与 conversation workers 由独立组合根注入；主算法参数保持 LoCoMo reported total-limit=60。
# ws02.5 config 归一化曾把 product schema 的 extract_threshold 搬进本文件；
# ws05.1 M11 已沿最终 consumer 证明它是 dead config，因而退出新 run identity。
# offline_update_score_threshold=0.8 仍被显式 LoCoMo consolidated 补充轨消费
# （README/tutorial 用 0.8，旧 adapter 硬编码 0.9）。embedder 已是 all-MiniLM 不动。
# 差异留档
# method-interface-inventory.md hyperparameters 字段。
# lifecycle_profile（2026-07-15 online-soft 改判）：Phase 1 五格主 profile 显式声明
# online_soft（论文 §3.3 soft updating at test time，只 direct insert、不做全库
# offline consolidation）。不依赖 dataclass 默认，两个 section 都显式写。LoCoMo
# 补充轨 locomo_offline_consolidated 不在此文件声明，需要时另建显式 profile。
# missing_timestamp_policy（2026-07-15 缺失时间兼容 Phase B）：online-soft 主 profile
# 显式声明 preserve_none，把 MemBench 官方 NoiseData 等无时间 message 的缺失 timestamp
# 原样保持 None 透传给 direct insert，绝不伪造时间。不依赖 dataclass 默认（默认为严格
# 的 require），两个 section 都显式写。consolidated 补充轨仍须用 require。裁决见
# branches/membench-time-semantics/notes/lightmem-missing-time-compatibility-ruling.md。
# messages_use（2026-07-16 hybrid role profile）：Phase 1 五格 unified 主 build 固定
# hybrid，同时使用 user 与 assistant 消息进行事实抽取。dataclass 默认为 user_only
# （LongMemEval Table 2 reproduction profile），两个 section 都显式写 hybrid。
# 裁决见 branches/input-role-semantics/notes/lightmem-messages-membench-beam-role-audit.md。

[method]
embedding_model_path = "models/all-MiniLM-L6-v2"
llmlingua_model_path = "models/llmlingua-2-bert-base-multilingual-cased-meetingbank"
retrieve_limit = 60
offline_update_score_threshold = 0.8
pre_compress = true
compression_rate = 0.7
stm_threshold = 512
topic_segment = true
text_summary = true
lifecycle_profile = "online_soft"
missing_timestamp_policy = "preserve_none"
messages_use = "hybrid"
locomo_input_profile = "framework_shared_v1"

# LightMem Table 3 的 GPT-4o-mini `(r=0.7, th=512)`、post-update 作者校准轨。
# 这不是主表配置：它逐项复现 LoCoMo 官方 user-only 输入、图片/时间渲染、
# combined top-60 与 conversation 末尾全库 offline consolidation（threshold=.9）。
[author_locomo]
answer_builder = "lightmem_locomo_paper_native_v1"
embedding_model_path = "models/all-MiniLM-L6-v2"
llmlingua_model_path = "models/llmlingua-2-bert-base-multilingual-cased-meetingbank"
retrieve_limit = 60
offline_update_score_threshold = 0.9
pre_compress = true
compression_rate = 0.7
stm_threshold = 512
topic_segment = true
text_summary = true
lifecycle_profile = "locomo_offline_consolidated"
missing_timestamp_policy = "require"
messages_use = "user_only"
locomo_input_profile = "author_harness_v1"
embedding_dimensions = 384
embedding_device = "cpu"
llmlingua_device_map = "cpu"
extraction_mode = "flat"
